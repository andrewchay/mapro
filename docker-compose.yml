services:
  web:
    build: .
    ports:
      - "3000:3000"
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - MAPRO_DATA_DIR=/app/data
      # 安全：默认监听容器内所有接口，外部访问必须设置 MAPRO_API_TOKEN
      - MAPRO_WEB_HOST=0.0.0.0
      # 生产环境必须配置稳定的 JWT Secret，否则容器重启后所有登录态会失效
      - MAPRO_JWT_SECRET=${MAPRO_JWT_SECRET:?必须设置 MAPRO_JWT_SECRET，建议使用 openssl rand -hex 32 生成}
      # 主密钥用于加密渠道 API Key 等敏感数据，必须与 JWT_SECRET 分开保管
      - MAPRO_MASTER_KEY=${MAPRO_MASTER_KEY:?必须设置 MAPRO_MASTER_KEY，建议使用 openssl rand -hex 32 生成}
      # 服务账号 Token：用于 httpOnly Cookie 自动认证和外部 API 调用
      # 生产部署 / 暴露端口时务必设置强随机 Token，并配合 HTTPS / 反向代理使用
      - MAPRO_API_TOKEN=${MAPRO_API_TOKEN:?必须设置 MAPRO_API_TOKEN，建议使用 openssl rand -hex 32 生成}
      # 如需跨域访问，可显式配置允许的 Origin
      # - MAPRO_ALLOWED_ORIGINS=https://app.example.com
      # 阶段 A 最小 Chat 配置（按需启用）
      # - MAPRO_CHAT_PROVIDER=deepseek
      # - MAPRO_CHAT_API_KEY=your-api-key
      # - MAPRO_CHAT_BASE_URL=https://api.deepseek.com
      # - MAPRO_CHAT_MODEL=deepseek-chat
    volumes:
      - mapro-data:/app/data

volumes:
  mapro-data:
