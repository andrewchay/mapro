name: Web E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MAPRO_TEST_DATABASE_URL: ${{ secrets.MAPRO_TEST_DATABASE_URL }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 类型检查
        run: bun run --filter='*' typecheck

      - name: 运行单元测试
        run: bun run test

      - name: 运行 Web 冒烟测试
        run: bun run scripts/smoke-test.ts
        timeout-minutes: 5
